appId: de.mcroleplay.launcher
productName: MC-ROLEPLAY.DE

directories:
  output: dist

files:
  - src/**/*
  - package.json
  - build/icon.png

extraResources:
  - from: resources/packwiz-installer-bootstrap.jar
    to: packwiz-installer-bootstrap.jar

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # Assistent statt One-Click: Nutzer kann den Installationsordner waehlen.
  # Auto-Updates laufen weiterhin still im gewaehlten Ordner (electron-updater
  # ruft den Installer mit /S auf und behaelt das bestehende Verzeichnis).
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: Aaron839
  repo: mc-roleplay-launcher
  releaseType: release
